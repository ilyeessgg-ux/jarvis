name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package JARVIS for Windows
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build EXE and zip
        shell: pwsh
        run: .\build_exe.ps1 -Clean -Python (Get-Command python).Source

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-win64
          path: dist/JARVIS-*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/JARVIS-*.zip --clobber
          } else {
            gh release create $tag dist/JARVIS-*.zip `
              --title "J.A.R.V.I.S. $tag" `
              --generate-notes
          }
